<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Alpha Scanner — live crypto momentum scanner. Bloomberg-terminal aesthetic. Mobile first." />
    <meta name="color-scheme" content="dark" />
    <title>alpha::scnr</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&family=Major+Mono+Display&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="scanline" aria-hidden="true"></div>

    <header class="hdr" role="banner">
      <div class="hdr-row">
        <h1 class="logo" aria-label="Alpha Scanner">alpha::scnr</h1>
        <div class="hdr-meta">
          <span class="live" aria-live="polite">
            <span class="live-dot" aria-hidden="true"></span>
            <span class="live-txt">LIVE</span>
          </span>
          <span class="ts" id="ts" aria-label="Last update">--:--:--</span>
        </div>
      </div>

      <div class="ticker" id="ticker" aria-label="Top movers ticker">
        <div class="ticker-track" id="ticker-track"></div>
      </div>

      <nav class="tabs" id="tabs" role="tablist" aria-label="Scanner tabs"></nav>

      <div class="chips" id="chips" role="toolbar" aria-label="Filters"></div>
    </header>

    <main class="main" id="main" role="main">
      <div class="list" id="list" role="list" aria-busy="false"></div>
      <div class="empty" id="empty" hidden>
        <div class="empty-glyph">::</div>
        <div class="empty-title">NO SIGNAL</div>
        <div class="empty-sub">Nothing matches this filter right now.</div>
      </div>
      <div class="err" id="err" hidden>
        <div class="err-glyph">!!</div>
        <div class="err-title">FEED INTERRUPTED</div>
        <div class="err-sub" id="err-sub">Could not reach the market feed.</div>
        <button class="err-btn" id="err-retry" type="button">RETRY</button>
      </div>
      <div class="foot" id="foot"></div>
    </main>

    <button
      class="fab"
      id="fab"
      type="button"
      aria-label="Refresh data"
      title="Refresh"
    >
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <path
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M3 12a9 9 0 0 1 15.5-6.3L21 8M21 3v5h-5M21 12a9 9 0 0 1-15.5 6.3L3 16M3 21v-5h5"
        />
      </svg>
    </button>

    <div class="modal" id="modal" hidden aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="m-name"></div>

    <script type="module" src="/src/app.js"></script>
  </body>
</html>
